name = "rentech"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Static assets — repo root-dan xidmət olunur (index.html, admin.html, *.svg, manifest.json, news.json)
# .assetsignore src/, wrangler.toml və s. serverdə göstərilmir
[assets]
directory = "./"
binding = "ASSETS"
# /api/* və /run həmişə Worker-ə gedir; digər yollar əvvəlcə asset yoxlanır
run_worker_first = ["/api/*", "/run"]

# Cron trigger — bot hər 3 saatda işləyir
# UTC-də 04:00, 08:00, 15:00 → Bakı vaxtı (UTC+4) 08:00, 12:00, 19:00
[triggers]
crons = ["0 4,8,15 * * *"]

# KV binding — Cloudflare dashboard-dan namespace ID-si əlavə et
# (Settings → Bindings → KV → NEWS_KV → rentech-news)
# Bu yeri boş qoyub dashboard-dan bind etmək daha rahatdır — nümunə:
# [[kv_namespaces]]
# binding = "NEWS_KV"
# id = "abc123..."

# Variables (public, dashboard-dan da dəyişmək olur)
[vars]
GEMINI_MODEL = "gemini-flash-lite-latest"
NTFY_SERVER = "https://ntfy.sh"
ADMIN_URL = "https://rentech.az/admin.html"

# Secrets (dashboard-dan Settings → Variables and Secrets → Add):
#   ADMIN_TOKEN      — admin.html paneli üçün auth
#   GEMINI_API_KEY   — tərcümə üçün
#   NTFY_TOPIC       — telefon push-u

[observability]
enabled = true
