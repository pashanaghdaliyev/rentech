name: Xəbər botu

on:
  schedule:
    # UTC ilə hər 3 saatdan bir (Bakı vaxtı ilə +4 saat)
    - cron: "17 */3 * * *"
  workflow_dispatch:        # düymə ilə əl ilə də işə salmaq üçün

permissions:
  contents: write

concurrency:
  group: xeber-botu
  cancel-in-progress: false

jobs:
  yenile:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu götür
        uses: actions/checkout@v4

      - name: Python quraşdır
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kitabxananı quraşdır
        run: pip install --quiet feedparser

      - name: Xəbərləri yığ
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Model adı dəyişsə, Settings → Secrets and variables → Variables
          # bölməsində GEMINI_MODEL yaz. Boş qalsa gemini-2.0-flash işlənir.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python news/bot.py

      - name: Dəyişiklik varsa yaz
        run: |
          git config user.name  "rentech-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --staged --quiet; then
            echo "Yeni xəbər yoxdur — dəyişiklik edilmədi."
          else
            git commit -m "xəbərlər yeniləndi ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            git push
          fi
