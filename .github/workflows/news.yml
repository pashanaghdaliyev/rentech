name: Xəbər botu

on:
  schedule:
    # Sutkada 3 dəfə — Bakı vaxtı ilə 08:00, 12:00, 19:00 (UTC+4).
    # UTC-də: 04:00, 08:00, 15:00.
    - cron: "0 4,8,15 * * *"
  workflow_dispatch:        # düymə ilə əl ilə də işə salmaq üçün

permissions:
  contents: write

concurrency:
  group: xeber-botu
  cancel-in-progress: false

jobs:
  yenile:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu götür
        uses: actions/checkout@v4

      - name: Python quraşdır
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kitabxananı quraşdır
        run: pip install --quiet feedparser

      - name: Xəbərləri yığ
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Model adı dəyişsə, Settings → Secrets and variables → Variables
          # bölməsində GEMINI_MODEL yaz. Boş qalsa default işlənir.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # ntfy.sh push. NTFY_TOPIC secret olsa: yeni xəbər gələndə telefona
          # push gedir. Boş qalsa bildiriş göndərilmir.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python news/bot.py

      - name: Dəyişiklik varsa yaz
        run: |
          git config user.name  "rentech-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet news.json; then
            echo "Yeni xəbər yoxdur — dəyişiklik edilmədi."
            exit 0
          fi
          for i in 1 2 3 4; do
            cp news.json /tmp/news.json.new
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/news.json.new news.json
            git add news.json
            if git diff --staged --quiet; then
              echo "Uzaq repo artıq eyni məzmunu daşıyır."
              exit 0
            fi
            git commit -m "xəbərlər yeniləndi ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            if git push; then
              exit 0
            fi
            echo "push cəhdi $i alınmadı, təkrar edirəm..."
            sleep $((i * 3))
          done
          echo "4 cəhddən sonra push mümkün olmadı."
          exit 1
