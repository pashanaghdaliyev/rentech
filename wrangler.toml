name = "rentech"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Static assets — repo root-dan xidmət olunur (index.html, admin.html, *.svg, manifest.json, news.json)
# .assetsignore src/, wrangler.toml və s. serverdə göstərilmir
[assets]
directory = "./"
binding = "ASSETS"
# Bütün istəklər əvvəlcə Worker-ə düşür; Worker özü /api/* və /run-u tutur,
# qalanlarını env.ASSETS.fetch(request) ilə static asset kimi qaytarır.
run_worker_first = true

# Cron trigger — bot hər 3 saatda işləyir
# UTC-də 04:00, 08:00, 15:00 → Bakı vaxtı (UTC+4) 08:00, 12:00, 19:00
[triggers]
crons = ["0 4,8,15 * * *"]

# Bağlantılar (bindings) MÜTLƏQ burada olmalıdır: Workers Builds hər commit-də
# `wrangler deploy` işlədir və bu faylda olmayan dashboard bağlantılarını silir.

# KV — xəbərlər (key: news.json)
[[kv_namespaces]]
binding = "NEWS_KV"
id = "2536c3320cbc491fa989c9dfe5c3dcb5"   # rentech-news

# Secrets Store (default_secrets_store) — kodda env.NAME.get() ilə oxunur
[[secrets_store_secrets]]
binding = "ADMIN_TOKEN"
store_id = "c389412c1eff4bd2834bc269174b5c3d"
secret_name = "ADMIN_TOKEN"

[[secrets_store_secrets]]
binding = "GEMINI_API_KEY"
store_id = "c389412c1eff4bd2834bc269174b5c3d"
secret_name = "GEMINI_API_KEY"

[[secrets_store_secrets]]
binding = "NTFY_TOPIC"
store_id = "c389412c1eff4bd2834bc269174b5c3d"
secret_name = "NTFY_TOPIC"

# Variables (public, dashboard-dan da dəyişmək olur)
[vars]
GEMINI_MODEL = "gemini-flash-lite-latest"
NTFY_SERVER = "https://ntfy.sh"
ADMIN_URL = "https://rentech.az/admin.html"

# Secret dəyərləri Secrets Store-dadır (yuxarıdakı [[secrets_store_secrets]]):
#   ADMIN_TOKEN      — admin.html paneli üçün auth
#   GEMINI_API_KEY   — tərcümə üçün
#   NTFY_TOPIC       — telefon push-u

[observability]
enabled = true
